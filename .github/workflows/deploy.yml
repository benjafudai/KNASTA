name: Deploy

# Publishes Repuestómetro on the VPS with Kamal (config/deploy.yml) once CI passes on main,
# or by hand from the Actions tab ("Run workflow"). It is skipped until the repository
# variable VPS_HOST exists. Setup: docs/despliegue.md.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: vars.VPS_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      APP_IP: ${{ vars.APP_IP }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      REPUESTOMETRO_DATABASE_PASSWORD: ${{ secrets.REPUESTOMETRO_DATABASE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load the VPS SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # setup installs Docker and starts PostgreSQL the first time; afterwards it only
      # skips what already exists and deploys the new version without downtime.
      - name: Deploy with Kamal
        run: bin/kamal setup
